name: Terraform Destroy

# Manual-only: destroys all infrastructure in a single environment.
# Always requires a reviewer to approve via the GitHub Environment gate
# before terraform destroy runs — there is no auto-trigger path.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy (dev, uat or prod)"
        required: true
        type: choice
        options: [dev, uat, prod]
      confirm:
        description: "Type the environment name again to confirm"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true
  TF_IN_AUTOMATION: true
  TF_VERSION: "1.15.8"

jobs:
  validate:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation matches environment
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "::error::Confirmation '${{ inputs.confirm }}' does not match environment '${{ inputs.environment }}'. Aborting."
            exit 1
          fi
          echo "Confirmation matched. Proceeding to destroy ${{ inputs.environment }}."

  destroy:
    name: Destroy ${{ inputs.environment }}
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false -lock-timeout=5m
